# quant_system Configuration

system:
  name: "quant_system"
  version: "0.1.0"
  env: "production"
  log_level: "INFO"

data:
  default_provider: "yfinance"   # 100% Free, no API key needed
  cache_dir: "./data/cache"
  default_symbols:
    crypto:
      - "SOL-USD"
      - "NEAR-USD"
      - "BTC-USD"
      - "ETH-USD"
    equity:
      - "AAPL"
      - "NVDA"
      - "MSFT"
      - "SPY"
  default_interval: "1d"         # Options: 1d, 1h, 15m
  history_days: 730              # 2 years of history for training

features:
  darvas_box_period: 20
  rsi_period: 14
  ema_fast: 12
  ema_slow: 26
  macd_signal: 9
  volatility_window: 20

model:
  type: "lightgbm"               # Qlib LGBModel
  objective: "binary"
  learning_rate: 0.05
  max_depth: 6
  num_leaves: 31
  n_estimators: 150
  target_horizon: 1              # Predict next bar direction (up/down)

server:
  host: "127.0.0.1"
  port: 8088
  reload: false
