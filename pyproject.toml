[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-system"
version = "0.1.0"
description = "Autonomous quantitative investment and ML prediction pipeline combining OpenBB zero-cost data with Microsoft Qlib."
readme = "README.md"
authors = [
    { name = "Quant System Team" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "openbb-core>=1.0.0",
    "openbb-yfinance>=1.0.0",
    "yfinance>=0.2.35",
    "pyqlib>=0.9.0",
    "lightgbm>=4.0.0",
    "scikit-learn>=1.3.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.2.0"
]

[project.scripts]
quant-server = "quant_system.api.server:main"
quant-cli = "quant_system.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["quant_system*"]
